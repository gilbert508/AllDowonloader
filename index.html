<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All Downloader | WebAssembly Muxer</title>
  <script crossorigin="anonymous" src="https://cdn.tailwindcss.com"></script>
  <script crossorigin="anonymous" src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script crossorigin="anonymous" src="https://unpkg.com/lucide@latest"></script>
  <!-- FFmpeg.wasm 0.12 UMD build -->
  <script crossorigin="anonymous" src="https://unpkg.com/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.js"></script>
  <script crossorigin="anonymous" src="https://unpkg.com/@ffmpeg/util@0.12.1/dist/umd/index.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
          colors: {
            brand: { yt: '#FF0033', fb: '#1877F2', insta: '#E1306C' },
            surface: { 900: '#07090E', 850: '#0C0F17', 800: '#121722', 700: '#1C2333', 600: '#2A3449' }
          }
        }
      }
    }
  </script>
  <style>
    body { background-color: #07090e; color: #f1f5f9; overflow-x: hidden; }
    .glass-panel { background: rgba(18, 23, 34, 0.7); backdrop-filter: blur(24px); border: 1px solid rgba(255, 255, 255, 0.08); }
    .glass-panel-hover { transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
    .glass-panel-hover:hover { border-color: rgba(255, 255, 255, 0.2); transform: translateY(-2px); box-shadow: 0 16px 40px -12px rgba(0, 0, 0, 0.6); }
    #three-canvas-container { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 0; opacity: 0.65; }
    .subtle-glow { position: absolute; width: 600px; height: 600px; border-radius: 50%; filter: blur(140px); pointer-events: none; z-index: 0; opacity: 0.15; }
  </style>
</head>
<body class="min-h-screen flex flex-col relative selection:bg-rose-500/30 selection:text-rose-200">
  <div id="three-canvas-container"></div>
  <div id="ambient-glow" class="subtle-glow top-[-100px] left-1/2 -translate-x-1/2 bg-red-600 transition-colors duration-700"></div>

  <header class="relative z-10 border-b border-white/[0.06] backdrop-blur-md bg-surface-900/60 sticky top-0">
    <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-rose-500 to-indigo-600 flex items-center justify-center shadow-lg shadow-rose-500/20">
          <i data-lucide="cpu" class="w-5 h-5 text-white"></i>
        </div>
        <div>
          <span class="text-xl font-bold tracking-tight bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent">ALL</span>
          <span class="text-xs font-semibold px-2 py-0.5 ml-2 rounded-full border border-white/10 text-slate-400">WASM ENGINE</span>
        </div>
      </div>
      <div class="flex items-center gap-4">
        <div class="flex items-center gap-2 px-3.5 py-1.5 rounded-full text-xs font-medium border border-emerald-500/30 bg-emerald-500/10 text-emerald-300">
          <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
          <span id="engine-status">WASM Ready</span>
        </div>
      </div>
    </div>
  </header>

  <main class="relative z-10 flex-1 max-w-5xl mx-auto w-full px-6 py-10">
    <div class="flex justify-center mb-8">
      <div class="glass-panel p-1.5 rounded-2xl flex items-center gap-1">
        <button data-platform="yt" class="platform-tab active px-5 py-2.5 rounded-xl text-sm font-semibold flex items-center gap-2.5 bg-white/[0.08] text-white">
          <i data-lucide="youtube" class="w-4 h-4 text-red-500"></i><span>YouTube</span>
        </button>
        <button data-platform="insta" class="platform-tab px-5 py-2.5 rounded-xl text-sm font-medium flex items-center gap-2.5 text-slate-400 hover:text-white">
          <i data-lucide="instagram" class="w-4 h-4 text-pink-500"></i><span>Instagram</span>
        </button>
        <button data-platform="fb" class="platform-tab px-5 py-2.5 rounded-xl text-sm font-medium flex items-center gap-2.5 text-slate-400 hover:text-white">
          <i data-lucide="facebook" class="w-4 h-4 text-blue-500"></i><span>Facebook</span>
        </button>
      </div>
    </div>

    <div class="flex items-center justify-between mb-6">
      <div>
        <h1 id="platform-title" class="text-3xl font-extrabold tracking-tight text-white flex items-center gap-3">
          YouTube Engine <span class="text-xs font-semibold px-2.5 py-1 rounded-md bg-white/[0.06] text-slate-400 border border-white/[0.08]">In-Browser Muxing</span>
        </h1>
        <p class="text-sm text-slate-400 mt-1">Lossless client-side audio/video merging without backend servers</p>
      </div>
    </div>

    <!-- Single Download View -->
    <div id="view-single" class="space-y-6">
      <div class="glass-panel p-6 rounded-3xl space-y-4">
        <div class="flex flex-col md:flex-row gap-3">
          <div class="relative flex-1">
            <i data-lucide="link-2" class="w-5 h-5 text-slate-500 absolute left-4 top-1/2 -translate-y-1/2"></i>
            <input id="single-url-input" type="text" placeholder="Paste YouTube link (Shorts, Watch, Reel)..." class="w-full bg-surface-850/80 border border-white/10 rounded-2xl pl-12 pr-4 py-4 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-rose-500/60">
          </div>
          <button id="inspect-btn" class="px-7 py-4 rounded-2xl bg-white hover:bg-slate-100 text-slate-900 font-bold text-sm flex items-center justify-center gap-2 transition-transform active:scale-95">
            <i data-lucide="zap" class="w-4 h-4 text-amber-500 fill-amber-500"></i>
            <span>Analyze Link</span>
          </button>
        </div>

        <div class="pt-2 flex flex-wrap items-center justify-between gap-4 border-t border-white/[0.06]">
          <div class="flex items-center gap-2">
            <span class="text-xs font-semibold text-slate-400">Output:</span>
            <div class="glass-panel p-1 rounded-xl flex items-center">
              <button id="format-video-btn" class="px-3.5 py-1 rounded-lg text-xs font-bold bg-white/10 text-white flex items-center gap-1.5">
                <i data-lucide="video" class="w-3.5 h-3.5"></i> Video (MP4)
              </button>
              <button id="format-audio-btn" class="px-3.5 py-1 rounded-lg text-xs font-medium text-slate-400 flex items-center gap-1.5">
                <i data-lucide="music" class="w-3.5 h-3.5"></i> Audio Only (MP3/M4A)
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Result Card -->
      <div id="media-card" class="glass-panel glass-panel-hover p-6 rounded-3xl hidden">
        <div class="flex flex-col md:flex-row gap-6 items-start">
          <div class="relative w-full md:w-64 aspect-video rounded-2xl overflow-hidden bg-surface-800 flex-shrink-0 border border-white/10 flex items-center justify-center">
            <img id="card-thumb" src="" alt="Thumbnail" class="w-full h-full object-cover">
          </div>
          <div class="flex-1 space-y-3 w-full">
            <span id="card-platform-badge" class="text-[10px] font-bold uppercase tracking-wider px-2.5 py-0.5 rounded-full bg-red-500/20 text-red-300">YOUTUBE</span>
            <h3 id="card-title" class="text-base font-bold text-white line-clamp-2">Media Stream</h3>
            <p id="card-status-desc" class="text-xs text-emerald-400 flex items-center gap-1">
              <i data-lucide="check-circle" class="w-3.5 h-3.5"></i> Tracks isolated and ready for merging
            </p>
            <div class="pt-4 flex items-center justify-between border-t border-white/[0.06]">
              <span id="card-format-label" class="text-xs font-bold text-white">MP4 Video (1080p)</span>
              <button id="download-trigger-btn" class="px-6 py-3 rounded-xl bg-gradient-to-r from-rose-500 to-indigo-600 text-white font-bold text-xs flex items-center gap-2 shadow-lg shadow-rose-500/20 hover:scale-105 active:scale-95 transition-all">
                <i data-lucide="download" class="w-4 h-4"></i>
                <span id="download-btn-text">Merge & Download</span>
              </button>
            </div>
            <div id="progress-box" class="hidden pt-2">
              <div class="w-full bg-surface-700 h-1.5 rounded-full overflow-hidden">
                <div id="progress-bar" class="bg-gradient-to-r from-rose-500 to-indigo-500 h-full w-0 transition-all duration-200"></div>
              </div>
              <p id="progress-status" class="text-[11px] text-slate-400 mt-1">Initializing WebAssembly runtime...</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script>
    lucide.createIcons();

    // 3D Background
    const container = document.getElementById('three-canvas-container');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    container.appendChild(renderer.domElement);

    const geometry = new THREE.IcosahedronGeometry(7, 1);
    const material = new THREE.MeshStandardMaterial({ color: 0x99a3ba, wireframe: true, roughness: 0.2, metalness: 0.8 });
    const crystal = new THREE.Mesh(geometry, material);
    scene.add(crystal);
    const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
    dirLight.position.set(10, 20, 15);
    scene.add(dirLight);
    scene.add(new THREE.AmbientLight(0xffffff, 0.6));
    camera.position.z = 24;

    let mouseX = 0, mouseY = 0;
    window.addEventListener('mousemove', (e) => {
      mouseX = (e.clientX / window.innerWidth - 0.5) * 2;
      mouseY = (e.clientY / window.innerHeight - 0.5) * 2;
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      crystal.rotation.x += 0.0015;
      crystal.rotation.y += 0.0025;
      crystal.position.x += (mouseX * 1.5 - crystal.position.x) * 0.05;
      crystal.position.y += (-mouseY * 1.5 - crystal.position.y) * 0.05;
      renderer.render(scene, camera);
    }
    animate();

    let currentFormat = 'video';
    let currentPlatform = 'yt';
    let parsedStreams = null;

    // FFmpeg WASM Instance
    const { FFmpeg } = FFmpegWASM;
    const { fetchFile, toBlobURL } = FFmpegUtil;
    let ffmpegInstance = null;

    async function getFFmpeg() {
      if (!ffmpegInstance) {
        ffmpegInstance = new FFmpeg();
        const baseURL = 'https://unpkg.com/@ffmpeg/core@0.12.6/dist/umd';
        await ffmpegInstance.load({
          coreURL: await toBlobURL(`${baseURL}/ffmpeg-core.js`, 'text/javascript'),
          wasmURL: await toBlobURL(`${baseURL}/ffmpeg-core.wasm`, 'application/wasm')
        });
      }
      return ffmpegInstance;
    }

    // Format selection
    const formatVideoBtn = document.getElementById('format-video-btn');
    const formatAudioBtn = document.getElementById('format-audio-btn');

    formatVideoBtn.addEventListener('click', () => {
      currentFormat = 'video';
      formatVideoBtn.className = 'px-3.5 py-1 rounded-lg text-xs font-bold bg-white/10 text-white flex items-center gap-1.5';
      formatAudioBtn.className = 'px-3.5 py-1 rounded-lg text-xs font-medium text-slate-400 flex items-center gap-1.5';
    });

    formatAudioBtn.addEventListener('click', () => {
      currentFormat = 'audio';
      formatAudioBtn.className = 'px-3.5 py-1 rounded-lg text-xs font-bold bg-white/10 text-white flex items-center gap-1.5';
      formatVideoBtn.className = 'px-3.5 py-1 rounded-lg text-xs font-medium text-slate-400 flex items-center gap-1.5';
    });

    // Extract raw audio & video tracks via direct client Android manifest
    async function extractTracks(rawUrl) {
      const cleanUrl = rawUrl.trim();
      const ytMatch = cleanUrl.match(/(?:shorts\/|v=|\/embed\/|youtu\.be\/|\/v\/)([a-zA-Z0-9_-]{11})/);
      const ytId = ytMatch ? ytMatch[1] : null;

      if (!ytId) throw new Error("Please enter a valid YouTube video or Shorts link.");

      let title = "video_download";
      let thumb = `https://i.ytimg.com/vi/${ytId}/hqdefault.jpg`;

      try {
        const oe = await fetch(`https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=${ytId}&format=json`);
        if (oe.ok) {
          const oed = await oe.json();
          title = oed.title || title;
        }
      } catch (_) {}

      // Official Android API query directly from client browser (uses home/mobile IP)
      const res = await fetch("https://www.youtube.com/youtubei/v1/player?prettyPrint=false", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          videoId: ytId,
          context: {
            client: {
              clientName: "ANDROID_TESTSUITE",
              clientVersion: "1.9",
              androidSdkVersion: 30,
              hl: "en",
              gl: "US"
            }
          }
        })
      });

      if (!res.ok) throw new Error("Unable to fetch video data from YouTube.");

      const data = await res.json();
      const adaptive = data.streamingData?.adaptiveFormats || [];
      const combined = data.streamingData?.formats || [];

      // Look for highest resolution video stream (MP4 preferred for copy-muxing)
      const videoTrack = adaptive
        .filter(f => f.mimeType?.includes("video/mp4") && f.url)
        .sort((a, b) => (b.height || 0) - (a.height || 0))[0] || 
        adaptive.filter(f => f.mimeType?.includes("video") && f.url).sort((a,b) => (b.height||0) - (a.height||0))[0];

      // Look for highest bitrate audio stream
      const audioTrack = adaptive
        .filter(f => f.mimeType?.includes("audio") && f.url)
        .sort((a, b) => (b.bitrate || 0) - (a.bitrate || 0))[0];

      // Progressive combined stream fallback
      const progressiveTrack = combined.filter(f => f.url && f.mimeType?.includes("mp4"))[0];

      if (!videoTrack && !progressiveTrack) {
        throw new Error("No usable video streams found for this link.");
      }

      return {
        title: title.replace(/[\\/*?:"<>|]/g, '').trim().slice(0, 80),
        thumb,
        videoUrl: videoTrack?.url || progressiveTrack?.url,
        audioUrl: audioTrack?.url || null,
        isCombined: !audioTrack || !!progressiveTrack
      };
    }

    // Inspect Single Link
    const inspectBtn = document.getElementById('inspect-btn');
    inspectBtn.addEventListener('click', async () => {
      const url = document.getElementById('single-url-input').value.trim();
      if (!url) return alert("Please enter a valid link.");

      inspectBtn.innerHTML = '<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i><span>Analyzing...</span>';
      lucide.createIcons();

      try {
        parsedStreams = await extractTracks(url);

        document.getElementById('card-title').textContent = parsedStreams.title;
        document.getElementById('card-thumb').src = parsedStreams.thumb;
        document.getElementById('card-platform-badge').textContent = 'YOUTUBE';
        document.getElementById('card-format-label').textContent = currentFormat === 'video' ? 'MP4 Video (Merged)' : 'M4A Audio Track';
        document.getElementById('media-card').classList.remove('hidden');
      } catch (err) {
        alert(err.message || "Failed to analyze link.");
      } finally {
        inspectBtn.innerHTML = '<i data-lucide="zap" class="w-4 h-4 text-amber-500 fill-amber-500"></i><span>Analyze Link</span>';
        lucide.createIcons();
      }
    });

    // Muxing and File Download Trigger
    const downloadTriggerBtn = document.getElementById('download-trigger-btn');
    downloadTriggerBtn.addEventListener('click', async () => {
      if (!parsedStreams) return;

      const pBox = document.getElementById('progress-box');
      const pBar = document.getElementById('progress-bar');
      const pStatus = document.getElementById('progress-status');

      pBox.classList.remove('hidden');
      pBar.style.width = '10%';
      downloadTriggerBtn.disabled = true;

      try {
        if (currentFormat === 'audio') {
          // Audio only download: no muxing required
          pStatus.textContent = 'Fetching audio track...';
          pBar.style.width = '50%';

          const aData = await fetchFile(parsedStreams.audioUrl);
          const aBlob = new Blob([aData.buffer], { type: 'audio/mp4' });
          const aUrl = URL.createObjectURL(aBlob);

          const a = document.createElement('a');
          a.href = aUrl;
          a.download = `${parsedStreams.title}.m4a`;
          document.body.appendChild(a);
          a.click();
          a.remove();
          URL.revokeObjectURL(aUrl);
        } else {
          // Video format: if already combined, download directly; otherwise merge via WASM
          if (parsedStreams.isCombined || !parsedStreams.audioUrl) {
            pStatus.textContent = 'Downloading combined file...';
            pBar.style.width = '70%';

            const vData = await fetchFile(parsedStreams.videoUrl);
            const vBlob = new Blob([vData.buffer], { type: 'video/mp4' });
            const vUrl = URL.createObjectURL(vBlob);

            const a = document.createElement('a');
            a.href = vUrl;
            a.download = `${parsedStreams.title}.mp4`;
            document.body.appendChild(a);
            a.click();
            a.remove();
            URL.revokeObjectURL(vUrl);
          } else {
            // Execute In-Browser FFmpeg Mux
            pStatus.textContent = 'Loading WebAssembly FFmpeg core...';
            pBar.style.width = '25%';
            const ffmpeg = await getFFmpeg();

            pStatus.textContent = 'Buffering video and audio streams...';
            pBar.style.width = '50%';
            const [vBuffer, aBuffer] = await Promise.all([
              fetchFile(parsedStreams.videoUrl),
              fetchFile(parsedStreams.audioUrl)
            ]);

            pStatus.textContent = 'Writing streams to virtual disk...';
            pBar.style.width = '70%';
            await ffmpeg.writeFile('in_v.mp4', vBuffer);
            await ffmpeg.writeFile('in_a.mp4', aBuffer);

            pStatus.textContent = 'Muxing MP4 stream (-c copy)...';
            pBar.style.width = '85%';

            // Fast stream-copy multiplexing without re-encoding
            await ffmpeg.exec([
              '-i', 'in_v.mp4',
              '-i', 'in_a.mp4',
              '-c', 'copy',
              '-movflags', '+faststart',
              'final.mp4'
            ]);

            pStatus.textContent = 'Finalizing download...';
            pBar.style.width = '95%';
            const outputData = await ffmpeg.readFile('final.mp4');

            // Cleanup virtual filesystem
            await ffmpeg.deleteFile('in_v.mp4');
            await ffmpeg.deleteFile('in_a.mp4');
            await ffmpeg.deleteFile('final.mp4');

            const outBlob = new Blob([outputData.buffer], { type: 'video/mp4' });
            const outUrl = URL.createObjectURL(outBlob);

            const dl = document.createElement('a');
            dl.href = outUrl;
            dl.download = `${parsedStreams.title}.mp4`;
            document.body.appendChild(dl);
            dl.click();
            dl.remove();
            URL.revokeObjectURL(outUrl);
          }
        }

        pBar.style.width = '100%';
        pStatus.textContent = 'Download completed!';
        setTimeout(() => pBox.classList.add('hidden'), 2000);
      } catch (err) {
        alert("Muxing error: " + (err.message || err));
        pBox.classList.add('hidden');
      } finally {
        downloadTriggerBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
