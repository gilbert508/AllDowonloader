<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All Downloader | Universal Media Suite</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
          colors: {
            brand: { yt: '#FF0033', fb: '#1877F2', insta: '#E1306C' },
            surface: { 900: '#07090E', 850: '#0C0F17', 800: '#121722', 700: '#1C2333', 600: '#2A3449' }
          }
        }
      }
    }
  </script>
  <style>
    body { background-color: #07090e; color: #f1f5f9; overflow-x: hidden; }
    .glass-panel { background: rgba(18, 23, 34, 0.7); backdrop-filter: blur(24px); border: 1px solid rgba(255, 255, 255, 0.08); }
    .glass-panel-hover { transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
    .glass-panel-hover:hover { border-color: rgba(255, 255, 255, 0.2); transform: translateY(-2px); box-shadow: 0 16px 40px -12px rgba(0, 0, 0, 0.6); }
    #three-canvas-container { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 0; opacity: 0.65; }
    .subtle-glow { position: absolute; width: 600px; height: 600px; border-radius: 50%; filter: blur(140px); pointer-events: none; z-index: 0; opacity: 0.15; }
  </style>
</head>
<body class="min-h-screen flex flex-col relative selection:bg-rose-500/30 selection:text-rose-200">
  <div id="three-canvas-container"></div>
  <div id="ambient-glow" class="subtle-glow top-[-100px] left-1/2 -translate-x-1/2 bg-red-600 transition-colors duration-700"></div>

  <header class="relative z-10 border-b border-white/[0.06] backdrop-blur-md bg-surface-900/60 sticky top-0">
    <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-rose-500 to-indigo-600 flex items-center justify-center shadow-lg shadow-rose-500/20">
          <i data-lucide="layers" class="w-5 h-5 text-white"></i>
        </div>
        <div>
          <span class="text-xl font-bold tracking-tight bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent">ALL</span>
          <span class="text-xs font-semibold px-2 py-0.5 ml-2 rounded-full border border-white/10 text-slate-400">DOWNLOADER</span>
        </div>
      </div>
      <div class="flex items-center gap-4">
        <div class="flex items-center gap-2 px-3.5 py-1.5 rounded-full text-xs font-medium border border-emerald-500/30 bg-emerald-500/10 text-emerald-300">
          <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
          <span>Zero-Redirect Stream Engine</span>
        </div>
      </div>
    </div>
  </header>

  <main class="relative z-10 flex-1 max-w-5xl mx-auto w-full px-6 py-10">
    <div class="flex justify-center mb-8">
      <div class="glass-panel p-1.5 rounded-2xl flex items-center gap-1">
        <button data-platform="yt" class="platform-tab active px-5 py-2.5 rounded-xl text-sm font-semibold flex items-center gap-2.5 bg-white/[0.08] text-white">
          <i data-lucide="youtube" class="w-4 h-4 text-red-500"></i><span>YouTube</span>
        </button>
        <button data-platform="insta" class="platform-tab px-5 py-2.5 rounded-xl text-sm font-medium flex items-center gap-2.5 text-slate-400 hover:text-white">
          <i data-lucide="instagram" class="w-4 h-4 text-pink-500"></i><span>Instagram</span>
        </button>
        <button data-platform="fb" class="platform-tab px-5 py-2.5 rounded-xl text-sm font-medium flex items-center gap-2.5 text-slate-400 hover:text-white">
          <i data-lucide="facebook" class="w-4 h-4 text-blue-500"></i><span>Facebook</span>
        </button>
      </div>
    </div>

    <div class="flex items-center justify-between mb-6">
      <div>
        <h1 id="platform-title" class="text-3xl font-extrabold tracking-tight text-white flex items-center gap-3">
          YouTube Engine <span class="text-xs font-semibold px-2.5 py-1 rounded-md bg-white/[0.06] text-slate-400 border border-white/[0.08]">Direct Stream</span>
        </h1>
        <p class="text-sm text-slate-400 mt-1">Direct stream decoding straight to device storage</p>
      </div>
      <div class="glass-panel p-1 rounded-xl flex items-center">
        <button id="mode-single-btn" class="px-4 py-1.5 rounded-lg text-xs font-bold bg-white/10 text-white">Single</button>
        <button id="mode-batch-btn" class="px-4 py-1.5 rounded-lg text-xs font-medium text-slate-400 hover:text-white">Batch</button>
      </div>
    </div>

    <!-- Single Download View -->
    <div id="view-single" class="space-y-6">
      <div class="glass-panel p-6 rounded-3xl space-y-4">
        <div class="flex flex-col md:flex-row gap-3">
          <div class="relative flex-1">
            <i data-lucide="link-2" class="w-5 h-5 text-slate-500 absolute left-4 top-1/2 -translate-y-1/2"></i>
            <input id="single-url-input" type="text" placeholder="Paste link (YouTube Shorts, Watch, Reel, Post)..." class="w-full bg-surface-850/80 border border-white/10 rounded-2xl pl-12 pr-4 py-4 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-rose-500/60">
          </div>
          <button id="inspect-btn" class="px-7 py-4 rounded-2xl bg-white hover:bg-slate-100 text-slate-900 font-bold text-sm flex items-center justify-center gap-2 transition-transform active:scale-95">
            <i data-lucide="zap" class="w-4 h-4 text-amber-500 fill-amber-500"></i>
            <span>Analyze Link</span>
          </button>
        </div>

        <div class="pt-2 flex flex-wrap items-center justify-between gap-4 border-t border-white/[0.06]">
          <div class="flex items-center gap-2">
            <span class="text-xs font-semibold text-slate-400">Mode:</span>
            <div class="glass-panel p-1 rounded-xl flex items-center">
              <button id="format-video-btn" class="px-3.5 py-1 rounded-lg text-xs font-bold bg-white/10 text-white flex items-center gap-1.5">
                <i data-lucide="video" class="w-3.5 h-3.5"></i> Video (MP4)
              </button>
              <button id="format-audio-btn" class="px-3.5 py-1 rounded-lg text-xs font-medium text-slate-400 flex items-center gap-1.5">
                <i data-lucide="music" class="w-3.5 h-3.5"></i> Audio Only (MP3)
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Result Card -->
      <div id="media-card" class="glass-panel glass-panel-hover p-6 rounded-3xl hidden">
        <div class="flex flex-col md:flex-row gap-6 items-start">
          <div class="relative w-full md:w-64 aspect-video rounded-2xl overflow-hidden bg-surface-800 flex-shrink-0 border border-white/10 flex items-center justify-center">
            <img id="card-thumb" src="" alt="Thumbnail" class="w-full h-full object-cover">
          </div>
          <div class="flex-1 space-y-3 w-full">
            <span id="card-platform-badge" class="text-[10px] font-bold uppercase tracking-wider px-2.5 py-0.5 rounded-full bg-red-500/20 text-red-300">YOUTUBE</span>
            <h3 id="card-title" class="text-base font-bold text-white line-clamp-2">Media Stream</h3>
            <p class="text-xs text-emerald-400 flex items-center gap-1">
              <i data-lucide="check-circle" class="w-3.5 h-3.5"></i> Stream verified & clean
            </p>
            <div class="pt-4 flex items-center justify-between border-t border-white/[0.06]">
              <span id="card-format-label" class="text-xs font-bold text-white">MP4 Video</span>
              <button id="download-trigger-btn" class="px-6 py-3 rounded-xl bg-gradient-to-r from-rose-500 to-indigo-600 text-white font-bold text-xs flex items-center gap-2 shadow-lg shadow-rose-500/20 hover:scale-105 active:scale-95 transition-all">
                <i data-lucide="download" class="w-4 h-4"></i>
                <span id="download-btn-text">Download Now</span>
              </button>
            </div>
            <div id="progress-box" class="hidden pt-2">
              <div class="w-full bg-surface-700 h-1.5 rounded-full overflow-hidden">
                <div id="progress-bar" class="bg-gradient-to-r from-rose-500 to-indigo-500 h-full w-0 transition-all duration-300"></div>
              </div>
              <p id="progress-status" class="text-[11px] text-slate-400 mt-1">Starting direct file transfer...</p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Batch Download View -->
    <div id="view-batch" class="space-y-6 hidden">
      <div class="glass-panel p-6 rounded-3xl space-y-4">
        <textarea id="batch-urls-input" rows="5" placeholder="Paste links (one per line)..." class="w-full bg-surface-850/80 border border-white/10 rounded-2xl p-4 text-xs font-mono text-white focus:outline-none"></textarea>
        <div class="flex flex-wrap items-center justify-between gap-4 pt-2 border-t border-white/[0.06]">
          <span id="batch-count-label" class="text-xs text-slate-400">0 links detected</span>
          <button id="batch-start-btn" class="px-6 py-3 rounded-xl bg-white text-slate-900 font-bold text-xs flex items-center gap-2">
            <i data-lucide="play" class="w-3.5 h-3.5"></i> Process Batch
          </button>
        </div>
      </div>
      <div id="batch-table-card" class="glass-panel p-6 rounded-3xl hidden">
        <h3 class="text-sm font-bold text-white mb-4">Resolved Downloads</h3>
        <div class="space-y-2.5" id="batch-items-container"></div>
      </div>
    </div>
  </main>

  <script>
    lucide.createIcons();

    // 3D Canvas Background
    const container = document.getElementById('three-canvas-container');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    container.appendChild(renderer.domElement);

    const geometry = new THREE.IcosahedronGeometry(7, 1);
    const material = new THREE.MeshStandardMaterial({ color: 0x99a3ba, wireframe: true, roughness: 0.2, metalness: 0.8 });
    const crystal = new THREE.Mesh(geometry, material);
    scene.add(crystal);
    const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
    dirLight.position.set(10, 20, 15);
    scene.add(dirLight);
    scene.add(new THREE.AmbientLight(0xffffff, 0.6));
    camera.position.z = 24;

    let mouseX = 0, mouseY = 0;
    window.addEventListener('mousemove', (e) => {
      mouseX = (e.clientX / window.innerWidth - 0.5) * 2;
      mouseY = (e.clientY / window.innerHeight - 0.5) * 2;
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      crystal.rotation.x += 0.0015;
      crystal.rotation.y += 0.0025;
      crystal.position.x += (mouseX * 1.5 - crystal.position.x) * 0.05;
      crystal.position.y += (-mouseY * 1.5 - crystal.position.y) * 0.05;
      renderer.render(scene, camera);
    }
    animate();

    let currentFormat = 'video';
    let currentPlatform = 'yt';
    let currentResolvedItem = null;

    const platforms = {
      yt: { title: 'YouTube Engine', badge: 'Direct Stream', glow: 'bg-red-600', placeholder: 'Paste YouTube link (Shorts, Watch, Video)...' },
      insta: { title: 'Instagram Engine', badge: 'Reels & Carousels', glow: 'bg-pink-600', placeholder: 'Paste Instagram Reel or Post link...' },
      fb: { title: 'Facebook Engine', badge: 'HD Watch & Reels', glow: 'bg-blue-600', placeholder: 'Paste Facebook Video link...' }
    };

    document.querySelectorAll('.platform-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.platform-tab').forEach(t => t.className = 'platform-tab px-5 py-2.5 rounded-xl text-sm font-medium flex items-center gap-2.5 text-slate-400 hover:text-white');
        tab.className = 'platform-tab active px-5 py-2.5 rounded-xl text-sm font-semibold flex items-center gap-2.5 bg-white/[0.08] text-white';
        currentPlatform = tab.dataset.platform;
        const info = platforms[currentPlatform];
        document.getElementById('platform-title').innerHTML = `${info.title} <span class="text-xs font-semibold px-2.5 py-1 rounded-md bg-white/[0.06] text-slate-400 border border-white/[0.08]">${info.badge}</span>`;
        document.getElementById('single-url-input').placeholder = info.placeholder;
        document.getElementById('ambient-glow').className = `subtle-glow top-[-100px] left-1/2 -translate-x-1/2 ${info.glow} transition-colors duration-700`;
      });
    });

    document.getElementById('mode-single-btn').addEventListener('click', () => {
      document.getElementById('mode-single-btn').className = 'px-4 py-1.5 rounded-lg text-xs font-bold bg-white/10 text-white';
      document.getElementById('mode-batch-btn').className = 'px-4 py-1.5 rounded-lg text-xs font-medium text-slate-400 hover:text-white';
      document.getElementById('view-single').classList.remove('hidden');
      document.getElementById('view-batch').classList.add('hidden');
    });

    document.getElementById('mode-batch-btn').addEventListener('click', () => {
      document.getElementById('mode-batch-btn').className = 'px-4 py-1.5 rounded-lg text-xs font-bold bg-white/10 text-white';
      document.getElementById('mode-single-btn').className = 'px-4 py-1.5 rounded-lg text-xs font-medium text-slate-400 hover:text-white';
      document.getElementById('view-batch').classList.remove('hidden');
      document.getElementById('view-single').classList.add('hidden');
    });

    const formatVideoBtn = document.getElementById('format-video-btn');
    const formatAudioBtn = document.getElementById('format-audio-btn');

    formatVideoBtn.addEventListener('click', () => {
      currentFormat = 'video';
      formatVideoBtn.className = 'px-3.5 py-1 rounded-lg text-xs font-bold bg-white/10 text-white flex items-center gap-1.5';
      formatAudioBtn.className = 'px-3.5 py-1 rounded-lg text-xs font-medium text-slate-400 flex items-center gap-1.5';
    });

    formatAudioBtn.addEventListener('click', () => {
      currentFormat = 'audio';
      formatAudioBtn.className = 'px-3.5 py-1 rounded-lg text-xs font-bold bg-white/10 text-white flex items-center gap-1.5';
      formatVideoBtn.className = 'px-3.5 py-1 rounded-lg text-xs font-medium text-slate-400 flex items-center gap-1.5';
    });

    // Native Manifest Extractor (Queries official YouTube stream decoders directly from the browser)
    async function resolveDirectMedia(rawUrl, isAudio) {
      const cleanUrl = rawUrl.trim();
      const ytMatch = cleanUrl.match(/(?:shorts\/|v=|\/embed\/|youtu\.be\/|\/v\/)([a-zA-Z0-9_-]{11})/);
      const ytId = ytMatch ? ytMatch[1] : null;

      let title = "Media Stream";
      let thumb = "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=800";

      if (ytId) {
        thumb = `https://i.ytimg.com/vi/${ytId}/hqdefault.jpg`;
        try {
          const oe = await fetch(`https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=${ytId}&format=json`);
          if (oe.ok) {
            const data = await oe.json();
            title = data.title || title;
          }
        } catch (_) {}

        const safeFilename = `${title.replace(/[\\/*?:"<>|]/g, '').trim().slice(0, 80)}.${isAudio ? 'mp3' : 'mp4'}`;

        // Direct YouTube Android Client Manifest (No proxies, no blocks, direct googlevideo stream)
        try {
          const ytPlayerPayload = {
            videoId: ytId,
            context: {
              client: {
                clientName: "ANDROID_TESTSUITE",
                clientVersion: "1.9",
                androidSdkVersion: 30,
                hl: "en",
                gl: "US"
              }
            }
          };

          const playerRes = await fetch("https://www.youtube.com/youtubei/v1/player?prettyPrint=false", {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify(ytPlayerPayload)
          });

          if (playerRes.ok) {
            const pData = await playerRes.json();
            const streamingData = pData.streamingData || {};
            const formats = streamingData.formats || [];
            const adaptiveFormats = streamingData.adaptiveFormats || [];

            if (isAudio) {
              const audios = adaptiveFormats
                .filter(f => f.mimeType?.includes("audio"))
                .sort((a, b) => (b.bitrate || 0) - (a.bitrate || 0));

              if (audios.length > 0 && audios[0].url) {
                return { title, thumb, directStreamUrl: audios[0].url, filename: safeFilename };
              }
            } else {
              // Direct progressive MP4 with video + audio combined (plays natively on iOS & Android)
              const mp4s = formats
                .filter(f => f.mimeType?.includes("mp4") || f.container === "mp4")
                .sort((a, b) => (b.height || 0) - (a.height || 0));

              if (mp4s.length > 0 && mp4s[0].url) {
                return { title, thumb, directStreamUrl: mp4s[0].url, filename: safeFilename };
              }
            }
          }
        } catch (_) {}

        // Secondary Direct Android Manifest Fallback
        try {
          const ytTvPayload = {
            videoId: ytId,
            context: {
              client: {
                clientName: "TVHTML5_SIMPLY_EMBEDDED_PLAYER",
                clientVersion: "2.0",
                hl: "en",
                gl: "US"
              }
            }
          };

          const tvRes = await fetch("https://www.youtube.com/youtubei/v1/player?prettyPrint=false", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(ytTvPayload)
          });

          if (tvRes.ok) {
            const tData = await tvRes.json();
            const formats = (tData.streamingData?.formats || []);
            const valid = formats.filter(f => f.url && (f.mimeType?.includes("mp4") || f.container === "mp4"));
            if (valid.length > 0) {
              return { title, thumb, directStreamUrl: valid[0].url, filename: safeFilename };
            }
          }
        } catch (_) {}
      }

      // Instagram & Facebook direct decoder
      const cobaltPayload = {
        url: cleanUrl,
        downloadMode: isAudio ? "audio" : "auto",
        videoQuality: "1080"
      };

      const nodes = [
        "https://cobalt-api.kwiatekmiki.com",
        "https://cobalt.hyper.lol"
      ];

      for (const node of nodes) {
        try {
          const cRes = await fetch(node, {
            method: "POST",
            headers: { "Accept": "application/json", "Content-Type": "application/json" },
            body: JSON.stringify(cobaltPayload),
            signal: AbortSignal.timeout(4000)
          });
          if (cRes.ok) {
            const cd = await cRes.json();
            const sUrl = cd.url || (cd.picker && cd.picker[0]?.url);
            if (sUrl) {
              return {
                title: "Media Stream",
                thumb: "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=800",
                directStreamUrl: sUrl,
                filename: `download_${Date.now()}.${isAudio ? 'mp3' : 'mp4'}`
              };
            }
          }
        } catch (_) {}
      }

      throw new Error("Unable to extract direct stream. Please ensure the video is public.");
    }

    // Direct Browser Download (Saves straight to local device storage, zero redirects)
    async function triggerDirectDownload(streamUrl, filename) {
      const pBox = document.getElementById('progress-box');
      const pBar = document.getElementById('progress-bar');
      const pStatus = document.getElementById('progress-status');

      pBox.classList.remove('hidden');
      pBar.style.width = '30%';
      pStatus.textContent = 'Connecting to media stream...';

      try {
        const response = await fetch(streamUrl);
        if (!response.ok) throw new Error();

        pBar.style.width = '70%';
        pStatus.textContent = 'Writing to local device...';

        const blob = await response.blob();
        const localBlobUrl = window.URL.createObjectURL(blob);

        const a = document.createElement('a');
        a.href = localBlobUrl;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();

        pBar.style.width = '100%';
        pStatus.textContent = 'Download finished!';

        setTimeout(() => {
          window.URL.revokeObjectURL(localBlobUrl);
          pBox.classList.add('hidden');
        }, 1500);
      } catch (_) {
        // Fallback for strict browser sandboxes (triggers native OS download manager)
        pBar.style.width = '100%';
        pStatus.textContent = 'Starting file download...';
        
        const directAnchor = document.createElement('a');
        directAnchor.href = streamUrl;
        directAnchor.setAttribute('download', filename);
        directAnchor.target = '_self';
        document.body.appendChild(directAnchor);
        directAnchor.click();
        setTimeout(() => {
          directAnchor.remove();
          pBox.classList.add('hidden');
        }, 1500);
      }
    }

    // Single Link Inspect
    const inspectBtn = document.getElementById('inspect-btn');
    inspectBtn.addEventListener('click', async () => {
      const url = document.getElementById('single-url-input').value.trim();
      if (!url) return alert('Please enter a valid link');

      inspectBtn.innerHTML = '<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i><span>Analyzing...</span>';
      lucide.createIcons();

      try {
        currentResolvedItem = await resolveDirectMedia(url, currentFormat === 'audio');

        document.getElementById('card-title').textContent = currentResolvedItem.title;
        document.getElementById('card-thumb').src = currentResolvedItem.thumb;
        document.getElementById('card-platform-badge').textContent = currentPlatform.toUpperCase();
        document.getElementById('card-format-label').textContent = currentFormat === 'video' ? 'MP4 Video' : 'MP3 Audio';
        document.getElementById('media-card').classList.remove('hidden');
      } catch (err) {
        alert(err.message || 'Stream extraction failed. Please retry.');
      } finally {
        inspectBtn.innerHTML = '<i data-lucide="zap" class="w-4 h-4 text-amber-500 fill-amber-500"></i><span>Analyze Link</span>';
        lucide.createIcons();
      }
    });

    // Single Download Trigger
    const downloadTriggerBtn = document.getElementById('download-trigger-btn');
    downloadTriggerBtn.addEventListener('click', async () => {
      if (!currentResolvedItem || !currentResolvedItem.directStreamUrl) return;

      downloadTriggerBtn.innerHTML = '<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i><span>Downloading...</span>';
      lucide.createIcons();

      await triggerDirectDownload(currentResolvedItem.directStreamUrl, currentResolvedItem.filename);

      downloadTriggerBtn.innerHTML = '<i data-lucide="download" class="w-4 h-4"></i><span>Download Now</span>';
      lucide.createIcons();
    });

    // Batch Multi-Queue
    const batchInput = document.getElementById('batch-urls-input');
    const batchCount = document.getElementById('batch-count-label');
    const batchStartBtn = document.getElementById('batch-start-btn');
    const batchTableCard = document.getElementById('batch-table-card');
    const batchItemsContainer = document.getElementById('batch-items-container');

    batchInput.addEventListener('input', () => {
      const count = batchInput.value.split('\n').filter(s => s.trim().length > 0).length;
      batchCount.textContent = `${count} link${count === 1 ? '' : 's'} detected`;
    });

    batchStartBtn.addEventListener('click', async () => {
      const urls = batchInput.value.split('\n').map(s => s.trim()).filter(Boolean);
      if (urls.length === 0) return alert('Paste at least one URL');

      batchTableCard.classList.remove('hidden');
      batchItemsContainer.innerHTML = '';
      const isAudio = (currentFormat === 'audio');

      for (let i = 0; i < urls.length; i++) {
        const url = urls[i];
        const row = document.createElement('div');
        row.className = 'glass-panel p-3.5 rounded-2xl flex items-center justify-between text-xs';
        row.innerHTML = `
          <span class="truncate max-w-md font-mono text-slate-300">${url}</span>
          <span id="batch-status-${i}" class="text-amber-400 flex items-center gap-1.5"><i data-lucide="loader-2" class="w-3.5 h-3.5 animate-spin"></i> Resolving</span>
        `;
        batchItemsContainer.appendChild(row);
        lucide.createIcons();

        try {
          const item = await resolveDirectMedia(url, isAudio);
          const s = document.getElementById(`batch-status-${i}`);
          s.className = 'text-emerald-400 flex items-center gap-2';
          s.innerHTML = `<button onclick="triggerDirectDownload('${item.directStreamUrl}', '${item.filename}')" class="font-bold text-white bg-white/10 hover:bg-white/20 px-3 py-1 rounded-lg">Download</button>`;
        } catch (_) {
          const s = document.getElementById(`batch-status-${i}`);
          s.className = 'text-rose-400';
          s.textContent = 'Failed';
        }
      }
    });
  </script>
</body>
</html>
